env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,22
env=XDG_CURRENT_DESKTOP,mango

exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec_once=env XMB_GAIN=3.0 xmbwave-sway
exec_once=mangobar
exec_once=mako
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store

var=lilac,0xCBA6F7ff
var=menu,rofi -show drun -theme ~/.config/rofi/lupine.rasi

blur=0
blur_layer=0
shadows=0
layer_shadows=0
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0

animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.85
animation_duration_move=200
animation_duration_open=180
animation_duration_tag=220
animation_duration_close=150
animation_duration_focus=0

new_is_master=0
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0
no_border_when_single=0

gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=2
root_color=0x000000ff
border_color=0x2a2a2aff
focus_color=$lilac
urgent_color=0xff5252ff
scratchpad_color=$lilac
global_color=$lilac
overlay_color=$lilac
maximized_screen_color=$lilac
drop_color=0xCBA6F755
split_color=$lilac

sloppy_focus=1
warp_cursor=0
focus_on_activate=1
cursor_size=22
repeat_rate=25
repeat_delay=600
xkb_rules_layout=us

bind=SUPER,r,reload_config
bind=SUPER+SHIFT,Escape,quit
bind=SUPER,Return,spawn,foot
bind=ALT,space,spawn_shell,$menu
bind=SUPER,d,spawn_shell,$menu
bind=SUPER,q,killclient
bind=ALT,F4,killclient
bind=SUPER,v,spawn_shell,cliphist list | rofi -dmenu -p clip -theme ~/.config/rofi/lupine.rasi | cliphist decode | wl-copy
bind=SUPER,n,spawn,nautilus
bind=SUPER+SHIFT,s,spawn_shell,mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | satty -f - --early-exit copy --save-after-copy --copy-command wl-copy --output-filename ~/Pictures/Screenshots/shot-$(date +%Y%m%d_%H%M%S).png
bind=SUPER+ALT,l,spawn,swaylock -f

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,Return,zoom

bind=SUPER,f,togglefullscreen
bind=SUPER,space,togglefloating
bind=SUPER,m,togglemaximizescreen
bind=SUPER,t,setlayout,tile
bind=SUPER,s,setlayout,scroller
bind=SUPER,g,setlayout,grid
bind=SUPER,o,setlayout,monocle
bind=SUPER+ALT,space,switch_layout
bind=SUPER,grave,toggle_scratchpad
bind=SUPER+SHIFT,grave,minimized
bind=SUPER+ALT,g,togglegaps
bind=SUPER+ALT,equal,incgaps,2
bind=SUPER+ALT,minus,incgaps,-2

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0

bind=CTRL+SHIFT,Up,movewin,+0,-20
bind=CTRL+SHIFT,Down,movewin,+0,+20
bind=CTRL+SHIFT,Left,movewin,-20,+0
bind=CTRL+SHIFT,Right,movewin,+20,+0
bind=CTRL+ALT,Up,resizewin,+0,-20
bind=CTRL+ALT,Down,resizewin,+0,+20
bind=CTRL+ALT,Left,resizewin,-20,+0
bind=CTRL+ALT,Right,resizewin,+20,+0

bind=NONE,XF86PowerOff,spawn,systemctl poweroff
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

window_rule=is_floating:1,width:760,height:430,app_id:^foot-float$
bind=SUPER+ALT,Return,spawn,foot -a foot-float
bind=SUPER,e,spawn,foot -e yazi
bind=SUPER+SHIFT,b,spawn,foot -e btop
